<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Errand</title>
<style>
  :root {
    --bg: #f7f5f1; --panel: #ffffff; --ink: #1c1b19; --muted: #6f6d68; --line: #e7e3db;
    --soft: #f1eee8; --accent: #e8590c; --accent-dark: #c2470a; --accent-soft: #fff1e8;
    --ok: #2b8a3e; --ok-soft: #ebf7ee; --warn: #b7791f; --warn-soft: #fff8e6; --bad: #c92a2a;
    --info: #1c7ed6; --violet: #7048e8;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    --radius: 16px; --shadow: 0 1px 2px rgba(28,27,25,.05), 0 4px 16px rgba(28,27,25,.05);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
         background: var(--bg); color: var(--ink); display: flex; flex-direction: column; }
  button, select, input { font: inherit; color: inherit; }

  /* ---------- top bar ---------- */
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: var(--panel);
           border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: #fff;
          display: grid; place-items: center; font-weight: 700; font-size: 18px; }
  .brand h1 { margin: 0; font-size: 17px; letter-spacing: -.01em; }
  .brand p { margin: 0; font-size: 12px; color: var(--muted); }
  .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .who { display: flex; align-items: center; gap: 8px; padding: 4px 6px 4px 4px; border: 1px solid var(--line);
         border-radius: 999px; background: var(--panel); }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--soft); color: var(--accent-dark);
            display: grid; place-items: center; font-weight: 600; font-size: 13px; flex: none; }
  .who select { border: 0; background: transparent; padding: 2px 4px; cursor: pointer; max-width: 210px; }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 14px;
         cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--soft); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: var(--accent-dark); }
  .btn.ghost { border-color: transparent; color: var(--muted); }
  .btn:disabled { opacity: .5; cursor: default; }

  /* ---------- layout ---------- */
  main { flex: 1; display: flex; min-height: 0; }
  #chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 24px 16px 12px; }
  .col { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  /* ---------- messages ---------- */
  .row { display: flex; gap: 10px; align-items: flex-end; }
  .row.user { justify-content: flex-end; }
  .row .avatar.bot { background: var(--accent); color: #fff; }
  .msg { max-width: min(78%, 620px); padding: 11px 15px; border-radius: var(--radius); white-space: pre-wrap;
         overflow-wrap: anywhere; }
  .row.user .msg { background: var(--ink); color: #fff; border-bottom-right-radius: 5px; }
  .row.assistant .msg { background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 5px;
                        box-shadow: var(--shadow); }
  .msg h4 { margin: 6px 0 2px; font-size: 15px; }
  .msg hr { border: 0; border-top: 1px solid var(--line); margin: 8px 0; }
  .msg.proactive { border-left: 4px solid var(--warn) !important; background: var(--warn-soft) !important; }
  .msg.success { border-color: #b8e0c2 !important; background: var(--ok-soft) !important; }
  .msg .badge { display: flex; align-items: center; gap: 6px; font-weight: 600; margin-bottom: 4px; }
  .msg.success .badge { color: var(--ok); }
  .msg.card { border: 1.5px solid var(--accent) !important; padding: 0; overflow: hidden; white-space: normal; }
  .card .head { background: var(--accent-soft); padding: 10px 15px; font-weight: 600; color: var(--accent-dark); }
  .card .body { padding: 10px 15px 4px; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 12px; margin: 0; }
  .kv dt { color: var(--muted); font-size: 13px; padding-top: 1px; }
  .kv dd { margin: 0; }
  .card .foot { padding: 6px 15px 12px; color: var(--muted); font-size: 13px; white-space: pre-wrap; }
  .card .pre { padding: 12px 15px 0; white-space: pre-wrap; }
  .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 0 15px 14px; }
  .msg.card.stale { opacity: .55; border-style: dashed !important; }
  .actions .note { font-size: 12px; color: var(--muted); }
  .note-line { display: block; margin-top: 8px; padding: 8px 10px; border-radius: 10px; background: var(--warn-soft);
               color: #7a4e0e; font-size: 14px; }
  .typing { display: inline-flex; gap: 4px; padding: 14px 16px !important; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: #c9c4ba; animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .3; } 40% { opacity: 1; } }

  /* ---------- quick replies ---------- */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding-left: 38px; }
  .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 7px 13px;
          cursor: pointer; font-size: 14px; }
  .chip:hover { border-color: var(--accent); color: var(--accent-dark); }

  /* ---------- checkout ---------- */
  .checkout { border: 1.5px solid var(--accent) !important; padding: 0 !important; overflow: hidden; white-space: normal; }
  .checkout .gw { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px;
                  background: var(--ink); color: #fff; font-size: 13px; }
  .checkout .gw span { opacity: .7; font-size: 11px; letter-spacing: .04em; }
  .checkout .inner { padding: 12px 15px; }
  .checkout .amt { font-size: 26px; font-weight: 700; margin: 2px 0 10px; letter-spacing: -.01em; }
  .checkout label { display: flex; align-items: center; gap: 10px; padding: 9px 11px; margin: 6px 0;
                    border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
  .checkout label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .checkout .actions { padding: 6px 0 0; }
  .checkout .note { font-size: 12px; color: var(--muted); margin-top: 10px; }

  /* ---------- composer ---------- */
  .composer { padding: 12px 16px 18px; }
  form { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; padding: 6px; background: var(--panel);
         border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow); }
  form input { flex: 1; border: 0; outline: 0; padding: 8px 14px; background: transparent; min-width: 0; }
  form .btn.primary { padding: 8px 18px; }
  .fine { max-width: 760px; margin: 8px auto 0; text-align: center; font-size: 12px; color: var(--muted); }

  /* ---------- developer panel (trace + demo controls) ---------- */
  #trace { width: 46%; max-width: 720px; border-left: 1px solid var(--line); background: #fbfaf8; display: none;
           flex-direction: column; min-height: 0; }
  body.dev #trace { display: flex; }
  .dev-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px;
               border-bottom: 1px solid var(--line); background: var(--panel); font-size: 13px; }
  .dev-tools select, .dev-tools button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px;
                                         padding: 4px 8px; font-size: 13px; cursor: pointer; }
  .dev-tools .meta { color: var(--muted); font-family: var(--mono); font-size: 11px; width: 100%; }
  .pane-title { padding: 8px 12px; font-size: 11px; color: var(--muted); text-transform: uppercase;
                letter-spacing: .06em; border-bottom: 1px solid var(--line); }
  #events { flex: 1; overflow-y: auto; font-family: var(--mono); font-size: 12px; padding: 6px 0; }
  .run { margin: 8px 12px 2px; padding-top: 6px; border-top: 1px dashed var(--line); color: var(--muted); }
  .ev { padding: 2px 12px; display: grid; grid-template-columns: 52px 118px 1fr; gap: 8px; cursor: pointer; }
  .ev:hover { background: #f0eee8; }
  .ev .t { color: var(--muted); }
  .ev span:last-child { overflow-wrap: anywhere; }
  .tag { font-weight: 600; }
  .k-model { color: var(--violet); } .k-tool { color: var(--info); } .k-state { color: var(--muted); }
  .k-approval { color: var(--accent); } .k-ok { color: var(--ok); } .k-bad { color: var(--bad); }
  .k-memory { color: #0b7285; } .k-warn { color: var(--warn); }
  pre.detail { margin: 2px 12px 6px 72px; padding: 8px; background: #fff; border: 1px solid var(--line);
               border-radius: 6px; white-space: pre-wrap; word-break: break-word; max-height: 300px; overflow: auto; }

  @media (max-width: 900px) {
    body.dev main { flex-direction: column; }
    .brand p { display: none; }
    #trace { width: 100%; max-width: none; height: 45%; border-left: 0; border-top: 1px solid var(--line); }
  }
  @media (max-width: 560px) {
    header { padding: 10px 12px; gap: 8px; }
    .brand p { display: none; }
    .who select { max-width: 130px; }
    #newBtn .long { display: none; }
    #devBtn { padding: 6px 10px; }
    #newBtn { padding: 6px 12px; }
    .msg { max-width: 86%; }
    .row .avatar.bot { display: none; }
    .chips { padding-left: 0; }
    #messages { padding: 16px 12px 8px; }
    .composer { padding: 8px 12px 12px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">E</div>
    <div><h1>Errand</h1><p>Trusted home services in Bangalore, booked for you</p></div>
  </div>
  <div class="right">
    <div class="who" title="Signed-in customer (demo: pick any)">
      <div class="avatar" id="whoAvatar">?</div>
      <select id="user"></select>
    </div>
    <button class="btn" id="newBtn">+ <span class="long">New chat</span></button>
    <button class="btn" id="devBtn" title="Show or hide the live trace and demo controls">Hide trace</button>
  </div>
</header>
<main>
  <section id="chat">
    <div id="messages"><div class="col" id="col"></div></div>
    <div class="composer">
      <form id="form"><input id="input" autocomplete="off" placeholder="What do you need done? e.g. a plumber for a leaking tap this week">
        <button class="btn primary">Send</button></form>
      <div class="fine">Nothing is booked or charged until you confirm. Prices are set by the provider.</div>
    </div>
  </section>
  <section id="trace">
    <div class="dev-tools">
      <label>next book():</label>
      <select id="force">
        <option value="">random (70/15/15)</option>
        <option value="success">success</option>
        <option value="timeout_booked">timeout after success</option>
        <option value="timeout_not_booked">timeout, not booked</option>
        <option value="slot_taken">slot_taken</option>
      </select>
      <button id="cancelBtn" title="Simulate the provider cancelling an upcoming booking">Provider cancels a booking</button>
      <span class="meta" id="meta">starting…</span>
    </div>
    <div class="pane-title">Trace (live) · click a line for details</div>
    <div id="events"></div>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
let sid = new URLSearchParams(location.search).get("s");
let es = null, lastRun = null;
const COL = () => $("#col");
const scrollDown = () => { $("#messages").scrollTop = 1e9; };

// Minimal, safe markdown: escape everything, then allow **bold**, *italic*, ### headings, ---.
function md(t) {
  const esc = t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return esc
    .replace(/^#{1,4}\s+(.+)$/gm, "<h4>$1</h4>")
    .replace(/^-{3,}$/gm, "<hr>")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*(?!\s)(.+?)\*/g, "$1<i>$2</i>")
    .replace(/\n?(<h4>|<hr>)/g, "$1").replace(/(<\/h4>|<hr>)\n/g, "$1");
}

// Code-written notes ("Note: you already have ...") get their own highlighted line.
function withNotes(html) {
  return html.replace(/(^|\n)(Note: [^\n]+)/g, '$1<span class="note-line">$2</span>');
}

// A confirmation card is written by code: "Please confirm this booking:\n• Key: value ...
// Reply \"yes\" ...". Render it as a booking card; any text before it stays a normal paragraph.
function renderCard(text) {
  const i = text.indexOf("Please confirm");
  const before = text.slice(0, i).trim(), card = text.slice(i);
  const lines = card.split("\n");
  const head = lines.shift().replace(/:$/, "");
  const rows = [], foot = [];
  lines.forEach(l => {
    const m = l.match(/^•\s*(Slot held until)\s+(.*)$/) || l.match(/^•\s*([A-Za-z][A-Za-z ]*):\s*(.*)$/);
    if (m) rows.push(`<dt>${md(m[1])}</dt><dd>${md(m[2])}</dd>`); else if (l.trim()) foot.push(md(l));
  });
  return (before ? `<div class="pre">${withNotes(md(before))}</div>` : "") +
    `<div class="head">${md(head)}</div><div class="body"><dl class="kv">${rows.join("")}</dl></div>` +
    `<div class="foot">${foot.join("\n")}</div>`;
}

function initials(name) { return (name || "?").trim().split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase(); }

function addMsg(role, text, opts = {}) {
  if (role === "user") text = text.replace(/^\[(.+?)( button)?\]$/, "$1");  // stored "[Confirm button]"
  const row = document.createElement("div"); row.className = `row ${role}`;
  const d = document.createElement("div");
  const isCard = role === "assistant" && (text.startsWith("Please confirm") || text.includes("\n\nPlease confirm"));
  const isDone = role === "assistant" && /^(Booked and verified|Cancelled and verified|Rescheduled and verified)/.test(text);
  d.className = "msg" + (opts.proactive ? " proactive" : "") + (isCard ? " card" : "") + (isDone ? " success" : "");
  if (isCard) d.innerHTML = renderCard(text);
  else if (isDone) {
    const [first, ...rest] = text.split("\n");
    d.innerHTML = `<div class="badge">✓ ${md(first)}</div>` + withNotes(md(rest.join("\n")));
  } else d.innerHTML = withNotes(md(text));
  if (role === "assistant") { const a = document.createElement("div"); a.className = "avatar bot"; a.textContent = "E"; row.append(a); }
  row.append(d);
  COL().appendChild(row);
  scrollDown();
  return d;
}

// Only the newest card is live. Older copies are dimmed and their buttons disabled, with a
// note saying why: the same card moved down, a newer card replaced it, or it's done.
function retireCards(except, pending) {
  document.querySelectorAll(".msg.card").forEach(c => {
    if (c === except || c.classList.contains("stale")) return;
    const a = c.querySelector(".actions");
    if (!a && !pending) return;            // finished cards from history stay as they are
    c.classList.add("stale");
    if (!a) return;
    a.querySelectorAll("button").forEach(b => b.disabled = true);
    const n = document.createElement("span"); n.className = "note";
    n.textContent = !pending ? "No longer active"
      : c.dataset.approval === pending.approval_id ? "Moved to the latest message ↓"
      : "Replaced by a newer card ↓";
    a.appendChild(n);
  });
}

function addApproval(el, pending) {
  if (!pending) return;
  retireCards(el, pending);
  el.dataset.approval = pending.approval_id;
  const a = document.createElement("div"); a.className = "actions";
  const yes = document.createElement("button"); yes.className = "btn primary"; yes.textContent = "Confirm";
  const no = document.createElement("button"); no.className = "btn"; no.textContent = "Decline";
  yes.onclick = () => approve(pending, true, a); no.onclick = () => approve(pending, false, a);
  a.append(yes, no); el.appendChild(a);
  scrollDown();
}

async function api(path, body) {
  const r = await fetch(path, { method: body ? "POST" : "GET",
    headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  return r.json();
}

function typing() {
  const row = document.createElement("div"); row.className = "row assistant";
  row.innerHTML = '<div class="avatar bot">E</div><div class="msg typing"><i></i><i></i><i></i></div>';
  COL().appendChild(row); scrollDown(); return row;
}

async function approve(p, ok, actionsEl) {
  actionsEl.remove();
  addMsg("user", ok ? "Confirm" : "Decline");
  const t = typing();
  try { showReplies(await api("/api/approve", { session_id: sid, approval_id: p.approval_id, fingerprint: p.fingerprint, approve: ok })); }
  finally { t.remove(); }
}

function showReplies(res) {
  removeChips();
  res.replies.forEach((t, i) => {
    const el = addMsg("assistant", t);
    if (i === res.replies.length - 1 && res.pending && el.classList.contains("card")) addApproval(el, res.pending);
  });
  if (!res.pending) retireCards(null, null);  // booked, declined or expired: no live card left
  showCheckout(res.checkout);
}

const rupees = (n) => "₹" + Number(n).toLocaleString("en-IN");
const prettySlot = (s) => new Date(s).toLocaleString("en-IN", { weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
function showCheckout(co) {  // the mock payment gateway's checkout (test mode)
  document.querySelectorAll(".row.checkout-row").forEach(c => c.remove());
  if (!co) return;
  const row = document.createElement("div"); row.className = "row assistant checkout-row";
  row.innerHTML = '<div class="avatar bot">E</div>';
  const box = document.createElement("div"); box.className = "msg checkout";
  const methods = Object.entries(co.methods).map(([k, v], i) =>
    `<label><input type="radio" name="pm" value="${k}" ${i === 0 ? "checked" : ""}> ${v}</label>`).join("");
  box.innerHTML = `<div class="gw"><b>Errand Pay</b><span>TEST MODE</span></div>
    <div class="inner"><div>${co.provider_name} · ${prettySlot(co.slot)}</div>
    <div class="amt">${rupees(co.amount)}</div>${methods}
    <div class="actions"><button class="btn primary">Pay ${rupees(co.amount)}</button><button class="btn">Cancel</button></div>
    <div class="note">Authorised now, charged only once the booking is verified. Test mode: no real money moves.</div></div>`;
  const [payBtn, cancelBtn] = box.querySelectorAll("button");
  const send = async (method, label) => {
    box.querySelectorAll("button, input").forEach(b => b.disabled = true);
    addMsg("user", label);
    const t = typing();
    try { showReplies(await api("/api/pay", { session_id: sid, approval_id: co.approval_id, fingerprint: co.fingerprint, method })); }
    finally { t.remove(); }
  };
  payBtn.onclick = () => { const m = box.querySelector("input[name=pm]:checked").value; send(m, `Pay with ${co.methods[m]}`); };
  cancelBtn.onclick = () => send("cancel", "Cancel payment");
  row.append(box); COL().appendChild(row); scrollDown();
}

// Quick replies under the greeting, only while the chat has nothing else in it.
const CHIPS = ["Find a plumber this week", "AC servicing this weekend", "Show my bookings", "What do you remember about me?"];
function showChips() {
  const c = document.createElement("div"); c.className = "chips";
  CHIPS.forEach(t => { const b = document.createElement("button"); b.className = "chip"; b.textContent = t;
    b.onclick = () => { $("#input").value = t; $("#form").requestSubmit(); }; c.append(b); });
  COL().appendChild(c); scrollDown();
}
function removeChips() { document.querySelectorAll(".chips").forEach(c => c.remove()); }

const KIND = (t) => t.startsWith("model") ? "k-model" : t === "tool_call" ? "k-tool" :
  t.startsWith("approval_violation") || t.includes("blocked") || t.includes("rejected") || t.includes("error") || t === "limit_hit" ? "k-bad" :
  t.startsWith("approval") ? "k-approval" : t.startsWith("memory") ? "k-memory" :
  t === "action_confirmed" ? "k-ok" : t.includes("ambiguous") || t.includes("retry") || t.includes("quarantined") || t.includes("unknown") ? "k-warn" : "k-state";

function summary(e) {
  const t = e.type;
  if (t === "tool_call") return `${e.tool}(${JSON.stringify(e.args)}) → ${e.ok ? (e.result && e.result.status) || "ok" : e.error}  ${e.latency_ms}ms  [${e.origin}${e.attempt ? " #" + e.attempt : ""}]`;
  if (t === "model_call") return `${e.role || "agent"} ${e.model} in=${e.input_tokens} out=${e.output_tokens} $${e.cost_usd ?? "?"} ${e.latency_ms ? e.latency_ms + "ms" : ""} → ${(e.tool_calls || []).map(c => c.name).join(", ") || "text"}`;
  if (t === "state_transition") return `${e.from_} → ${e.to}  (${e.reason})`;
  if (t === "context_built") return `${e.total_tokens}/${e.budget_tokens} tok · memories [${e.memory_included.join(", ")}] · excluded ${e.memory_excluded.length} · history omitted ${e.history_omitted}`;
  if (t === "run_start") return `${e.kind}`;
  if (t === "run_end") return `${e.outcome}  phase=${e.phase}`;
  if (t === "user_message" || t === "assistant_message") return (e.text || "").slice(0, 90);
  const rest = { ...e }; ["seq", "gseq", "ts", "session_id", "run_id", "elapsed_ms", "type"].forEach(k => delete rest[k]);
  return JSON.stringify(rest).slice(0, 140);
}

function addEvent(e) {
  if (e.run_id && e.run_id !== lastRun && e.type === "run_start") {
    const r = document.createElement("div"); r.className = "run"; r.textContent = `── ${e.run_id} · ${e.kind}`;
    $("#events").appendChild(r); lastRun = e.run_id;
  }
  const d = document.createElement("div"); d.className = "ev";
  d.innerHTML = `<span class="t">${e.elapsed_ms != null ? (e.elapsed_ms / 1000).toFixed(2) + "s" : ""}</span><span class="tag ${KIND(e.type)}"></span><span></span>`;
  d.children[1].textContent = e.type; d.children[2].textContent = summary(e);
  d.onclick = () => {
    if (d.nextSibling && d.nextSibling.classList && d.nextSibling.classList.contains("detail")) { d.nextSibling.remove(); return; }
    const p = document.createElement("pre"); p.className = "detail"; p.textContent = JSON.stringify(e, null, 2); d.after(p);
  };
  const box = $("#events"); const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  box.appendChild(d); if (atBottom) box.scrollTop = 1e9;
}

function stream() {
  if (es) es.close();
  $("#events").innerHTML = ""; lastRun = null;
  es = new EventSource(`/api/trace/${sid}/stream`);
  es.onmessage = (m) => {
    const item = JSON.parse(m.data);
    if (item.kind === "trace") addEvent(item.event);
    if (item.kind === "chat") { removeChips(); const el = addMsg("assistant", item.text, { proactive: item.proactive }); if (el.classList.contains("card")) addApproval(el, item.pending); }
  };
}

let users = [];
async function loadUsers() {  // labels show each user's current area (it can change in chat)
  const r = await api("/api/users"), keep = $("#user").value;
  users = r.users;
  $("#user").innerHTML = users.map(u =>
    `<option value="${u.user_id}">${u.name}${u.area ? " · " + u.area : ""}</option>`).join("");
  if (keep) $("#user").value = keep;
  setAvatar();
}
function setAvatar() {
  const u = users.find(x => x.user_id === $("#user").value);
  $("#whoAvatar").textContent = initials(u && u.name);
}

async function start(newOne) {
  if (newOne || !sid) {
    const r = await api("/api/session", { user_id: $("#user").value || null });
    sid = r.session_id; history.replaceState(null, "", `?s=${sid}`);
  }
  const s = await api(`/api/session/${sid}`);
  if (s.user) $("#user").value = s.user.user_id;   // a chat always belongs to one user
  setAvatar();
  $("#meta").textContent = `${s.user ? s.user.name + " · " : ""}session ${sid} · model ${s.model}`;
  COL().innerHTML = "";
  s.messages.forEach((m, i) => { const el = addMsg(m.role, m.text); if (i === s.messages.length - 1 && s.pending && el.classList.contains("card")) addApproval(el, s.pending); });
  if (s.messages.length <= 1 && !s.pending) showChips();
  showCheckout(s.checkout);
  stream();
}

$("#form").onsubmit = async (ev) => {
  ev.preventDefault();
  const text = $("#input").value.trim(); if (!text) return;
  $("#input").value = ""; removeChips(); addMsg("user", text);
  const t = typing();
  try { showReplies(await api("/api/chat", { session_id: sid, text })); loadUsers(); }
  finally { t.remove(); }
};
$("#force").onchange = async (e) => { if (e.target.value) await api("/api/debug/force_book", { outcome: e.target.value }); };
$("#cancelBtn").onclick = async () => {
  const r = await api("/api/debug/provider_cancel", { session_id: sid });
  addMsg("assistant", r.cancelled ? `(simulation) Provider cancelled ${r.cancelled}. The agent will notice on its next poll (≤3s).` : "(simulation) No upcoming booking to cancel.");
};
// The trace is shown by default; the button hides it (remembered per browser).
function setDev(on) {
  document.body.classList.toggle("dev", on);
  $("#devBtn").textContent = on ? "Hide trace" : "Show trace";
  try { localStorage.setItem("errand-trace", on ? "on" : "off"); } catch (e) {}
}
$("#devBtn").onclick = () => setDev(!document.body.classList.contains("dev"));
let traceOn = true;
try { traceOn = localStorage.getItem("errand-trace") !== "off"; } catch (e) {}
setDev(traceOn);
$("#newBtn").onclick = () => start(true);
$("#user").onchange = () => start(true);           // switching user opens that user's chat
loadUsers().then(() => start(false));
</script>
</body>
</html>
