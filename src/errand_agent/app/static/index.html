<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Errand Agent</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e4e2dc;
    --accent: #e8590c; --accent-ink: #ffffff; --user: #1d1d1b; --user-ink: #ffffff;
    --ok: #2b8a3e; --warn: #b7791f; --bad: #c92a2a; --info: #1c7ed6; --violet: #7048e8;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--ink); height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--line);
           background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  header .meta { color: var(--muted); font-size: 12px; font-family: var(--mono); }
  header .tools { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select, button { font: inherit; border: 1px solid var(--line); background: var(--panel); border-radius: 6px;
                   padding: 5px 9px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  main { flex: 1; display: grid; grid-template-columns: minmax(360px, 1fr) minmax(420px, 1.15fr); min-height: 0; }
  section { display: flex; flex-direction: column; min-height: 0; }
  #chat { border-right: 1px solid var(--line); }
  .pane-title { padding: 8px 16px; font-size: 12px; color: var(--muted); text-transform: uppercase;
                letter-spacing: .06em; border-bottom: 1px solid var(--line); background: var(--panel); }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 88%; padding: 9px 12px; border-radius: 12px; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--user); color: var(--user-ink); border-bottom-right-radius: 3px; }
  .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 3px; }
  .msg.proactive { border-left: 3px solid var(--warn); }
  .msg.card { border: 1.5px solid var(--accent); }
  .actions { display: flex; gap: 8px; margin-top: 8px; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--panel); }
  form input { flex: 1; font: inherit; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; }
  #trace { background: #fbfaf8; }
  #events { flex: 1; overflow-y: auto; font-family: var(--mono); font-size: 12px; padding: 6px 0; }
  .run { margin: 8px 12px 2px; padding-top: 6px; border-top: 1px dashed var(--line); color: var(--muted); }
  .ev { padding: 2px 12px; display: grid; grid-template-columns: 64px 118px 1fr; gap: 8px; cursor: pointer; }
  .ev:hover { background: #f0eee8; }
  .ev .t { color: var(--muted); }
  .ev span:last-child { overflow-wrap: anywhere; }
  .tag { font-weight: 600; }
  .k-model { color: var(--violet); } .k-tool { color: var(--info); } .k-state { color: var(--muted); }
  .k-approval { color: var(--accent); } .k-ok { color: var(--ok); } .k-bad { color: var(--bad); }
  .k-memory { color: #0b7285; } .k-warn { color: var(--warn); }
  pre.detail { margin: 2px 12px 6px 84px; padding: 8px; background: #fff; border: 1px solid var(--line);
               border-radius: 6px; white-space: pre-wrap; word-break: break-word; max-height: 300px; overflow: auto; }
  .typing { color: var(--muted); font-style: italic; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } #chat { border-right: 0; } }
</style>
</head>
<body>
<header>
  <h1>Errand Agent</h1>
  <span class="meta" id="meta">starting…</span>
  <div class="tools">
    <label class="meta">next book():</label>
    <select id="force">
      <option value="">random (70/15/15)</option>
      <option value="success">success</option>
      <option value="timeout_booked">timeout after success</option>
      <option value="timeout_not_booked">timeout, not booked</option>
      <option value="slot_taken">slot_taken</option>
    </select>
    <button id="cancelBtn" title="Simulate the provider cancelling an upcoming booking">Provider cancels a booking</button>
    <button id="newBtn">New session</button>
  </div>
</header>
<main>
  <section id="chat">
    <div class="pane-title">Chat</div>
    <div id="messages"></div>
    <form id="form"><input id="input" autocomplete="off" placeholder="e.g. Find a plumber for my kitchen tap this week, mornings only, under ₹1,500">
      <button class="primary">Send</button></form>
  </section>
  <section id="trace">
    <div class="pane-title">Trace (live) — click a line for details</div>
    <div id="events"></div>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
let sid = new URLSearchParams(location.search).get("s");
let es = null, lastRun = null;

function addMsg(role, text, opts = {}) {
  const d = document.createElement("div");
  d.className = `msg ${role}` + (opts.proactive ? " proactive" : "") +
    (text.startsWith("Please confirm") || text.includes("\n\nPlease confirm") ? " card" : "");
  d.innerHTML = md(text);
  $("#messages").appendChild(d);
  $("#messages").scrollTop = 1e9;
  return d;
}

// Minimal, safe markdown: escape everything, then allow **bold** and *italic*.
function md(t) {
  const esc = t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return esc.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*(?!\s)(.+?)\*/g, "$1<i>$2</i>");
}

function addApproval(el, pending) {
  if (!pending) return;
  const a = document.createElement("div"); a.className = "actions";
  const yes = document.createElement("button"); yes.className = "primary"; yes.textContent = "Confirm";
  const no = document.createElement("button"); no.textContent = "Decline";
  yes.onclick = () => approve(pending, true, a); no.onclick = () => approve(pending, false, a);
  a.append(yes, no); el.appendChild(a);
}

async function api(path, body) {
  const r = await fetch(path, { method: body ? "POST" : "GET",
    headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  return r.json();
}

async function approve(p, ok, actionsEl) {
  actionsEl.remove();
  addMsg("user", ok ? "[Confirm]" : "[Decline]");
  const res = await api("/api/approve", { session_id: sid, approval_id: p.approval_id, fingerprint: p.fingerprint, approve: ok });
  showReplies(res);
}

function showReplies(res) {
  res.replies.forEach((t, i) => {
    const el = addMsg("assistant", t);
    if (i === res.replies.length - 1 && res.pending && el.classList.contains("card")) addApproval(el, res.pending);
  });
}

const KIND = (t) => t.startsWith("model") ? "k-model" : t === "tool_call" ? "k-tool" :
  t.startsWith("approval_violation") || t.includes("blocked") || t.includes("rejected") || t.includes("error") || t === "limit_hit" ? "k-bad" :
  t.startsWith("approval") ? "k-approval" : t.startsWith("memory") ? "k-memory" :
  t === "action_confirmed" ? "k-ok" : t.includes("ambiguous") || t.includes("retry") || t.includes("quarantined") || t.includes("unknown") ? "k-warn" : "k-state";

function summary(e) {
  const t = e.type;
  if (t === "tool_call") return `${e.tool}(${JSON.stringify(e.args)}) → ${e.ok ? (e.result && e.result.status) || "ok" : e.error}  ${e.latency_ms}ms  [${e.origin}${e.attempt ? " #" + e.attempt : ""}]`;
  if (t === "model_call") return `${e.role || "agent"} ${e.model} in=${e.input_tokens} out=${e.output_tokens} $${e.cost_usd ?? "?"} ${e.latency_ms ? e.latency_ms + "ms" : ""} → ${(e.tool_calls || []).map(c => c.name).join(", ") || "text"}`;
  if (t === "state_transition") return `${e.from_} → ${e.to}  (${e.reason})`;
  if (t === "context_built") return `${e.total_tokens}/${e.budget_tokens} tok · memories [${e.memory_included.join(", ")}] · excluded ${e.memory_excluded.length} · history omitted ${e.history_omitted}`;
  if (t === "run_start") return `${e.kind}`;
  if (t === "run_end") return `${e.outcome}  phase=${e.phase}`;
  if (t === "user_message" || t === "assistant_message") return (e.text || "").slice(0, 90);
  const rest = { ...e }; ["seq", "gseq", "ts", "session_id", "run_id", "elapsed_ms", "type"].forEach(k => delete rest[k]);
  return JSON.stringify(rest).slice(0, 140);
}

function addEvent(e) {
  if (e.run_id && e.run_id !== lastRun && e.type === "run_start") {
    const r = document.createElement("div"); r.className = "run"; r.textContent = `── ${e.run_id} · ${e.kind}`;
    $("#events").appendChild(r); lastRun = e.run_id;
  }
  const d = document.createElement("div"); d.className = "ev";
  d.innerHTML = `<span class="t">${e.elapsed_ms != null ? (e.elapsed_ms / 1000).toFixed(2) + "s" : ""}</span><span class="tag ${KIND(e.type)}"></span><span></span>`;
  d.children[1].textContent = e.type; d.children[2].textContent = summary(e);
  d.onclick = () => {
    if (d.nextSibling && d.nextSibling.classList && d.nextSibling.classList.contains("detail")) { d.nextSibling.remove(); return; }
    const p = document.createElement("pre"); p.className = "detail"; p.textContent = JSON.stringify(e, null, 2); d.after(p);
  };
  const box = $("#events"); const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  box.appendChild(d); if (atBottom) box.scrollTop = 1e9;
}

function stream() {
  if (es) es.close();
  $("#events").innerHTML = ""; lastRun = null;
  es = new EventSource(`/api/trace/${sid}/stream`);
  es.onmessage = (m) => {
    const item = JSON.parse(m.data);
    if (item.kind === "trace") addEvent(item.event);
    if (item.kind === "chat") { const el = addMsg("assistant", item.text, { proactive: item.proactive }); if (el.classList.contains("card")) addApproval(el, item.pending); }
  };
}

async function start(newOne) {
  if (newOne || !sid) { const r = await api("/api/session", {}); sid = r.session_id; history.replaceState(null, "", `?s=${sid}`); }
  const s = await api(`/api/session/${sid}`);
  $("#meta").textContent = `session ${sid} · model ${s.model}`;
  $("#messages").innerHTML = "";
  s.messages.forEach((m, i) => { const el = addMsg(m.role, m.text); if (i === s.messages.length - 1 && s.pending && el.classList.contains("card")) addApproval(el, s.pending); });
  stream();
}

$("#form").onsubmit = async (ev) => {
  ev.preventDefault();
  const text = $("#input").value.trim(); if (!text) return;
  $("#input").value = ""; addMsg("user", text);
  const typing = addMsg("assistant", "…thinking"); typing.classList.add("typing");
  try { showReplies(await api("/api/chat", { session_id: sid, text })); }
  finally { typing.remove(); }
};
$("#force").onchange = async (e) => { if (e.target.value) await api("/api/debug/force_book", { outcome: e.target.value }); };
$("#cancelBtn").onclick = async () => {
  const r = await api("/api/debug/provider_cancel", {});
  addMsg("assistant", r.cancelled ? `(simulation) Provider cancelled ${r.cancelled}. The agent will notice on its next poll (≤3s).` : "(simulation) No upcoming booking to cancel.");
};
$("#newBtn").onclick = () => start(true);
start(false);
</script>
</body>
</html>
