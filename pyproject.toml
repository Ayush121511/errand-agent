[project]
name = "errand-agent"
version = "0.1.0"
description = "Chat agent that books, cancels and reschedules home-service errands against mock provider tools, with code-enforced approvals and idempotent booking."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/errand_agent"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/errand_agent/mocks/catalog.py" = ["E501"]  # data table
"src/errand_agent/core/untrusted.py" = ["E501"]  # regex table
